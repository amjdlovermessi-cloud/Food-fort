<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2b"><title>Food Fort V2 | المنيو</title>
<style>
:root{--brand:#c90019;--accent:#178447;--bg:#f5f6f7;--ink:#202938;--muted:#788394}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.hero{background:linear-gradient(125deg,#101b2b,#243b52);color:#fff;padding:36px 18px 28px;text-align:center}.logo{font-size:27px;font-weight:900}.hero p{color:#d4dce5;font-size:12px}.wrap{max-width:1000px;margin:auto;padding:18px}.banner{background:#fff;border-radius:14px;padding:18px;margin-top:-12px;box-shadow:0 8px 30px #101b2b0c}.notice{color:var(--muted);font-size:12px;line-height:1.8}.tabs{display:flex;gap:8px;overflow:auto;padding:17px 0;position:sticky;top:0;background:var(--bg);z-index:3}.tabs button{white-space:nowrap;border:0;border-radius:22px;padding:10px 15px;background:#fff;color:#394456;font-weight:bold}.tabs button.active{background:var(--brand);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}.item{background:#fff;border-radius:15px;overflow:hidden;border:1px solid #e9edf1}.item img{width:100%;height:145px;object-fit:cover;background:#e9edf1}.itembody{padding:13px}.item h3{font-size:15px;margin:0 0 7px}.item p{font-size:11px;color:var(--muted);line-height:1.6;min-height:34px}.price{font-size:16px;font-weight:900;color:var(--brand)}.item button{width:100%;margin-top:10px;background:var(--brand);color:#fff;border:0;border-radius:9px;padding:10px;font-weight:bold}.cart{position:fixed;bottom:14px;left:14px;right:14px;max-width:600px;margin:auto;background:#101b2b;color:#fff;border-radius:14px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 30px #0003}.cart button{background:#fff;color:#101b2b;border:0;border-radius:9px;padding:9px 13px;font-weight:bold}.empty{text-align:center;background:#fff;border-radius:14px;padding:40px 15px;color:var(--muted)}@media(max-width:560px){.wrap{padding:12px}.hero{padding:28px 15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item img{height:112px}.itembody{padding:10px}.item h3{font-size:13px}.item p{font-size:10px}}
</style></head><body><header class="hero"><div class="logo" id="name">Food Fort</div><p id="tagline">قائمة الطعام الرقمية</p></header><main class="wrap"><div class="banner"><b>أهلاً بك 👋</b><p class="notice" id="intro">اختر من الأصناف المتاحة. تتوفر تجربة العرض الأولية، وسيتم تفعيل الطلب الإلكتروني بعد إكمال إعدادات النشر.</p></div><nav class="tabs" id="tabs"></nav><div id="menu" class="grid"></div></main><div class="cart"><span id="cartText">السلة فارغة</span><button id="checkout" disabled>إتمام الطلب</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://gghlmpxmiivrkiltydxf.supabase.co";const SUPABASE_KEY="sb_publishable_-oLYi0Su5SXOGmQBuZcvcw_TIHJ1D8h";const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const slug=new URLSearchParams(location.search).get('restaurant')||'food-fort';
const menuEl=document.getElementById('menu');let categories=[],products=[],cart={};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(filter='all'){const rows=products.filter(p=>p.is_available&&(filter==='all'||p.category_id===filter));menuEl.innerHTML=rows.length?rows.map(p=>'<article class="item">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="">':'<div style="height:145px;background:#edf0f3"></div>')+'<div class="itembody"><h3>'+esc(p.name)+'</h3><p>'+esc(p.description||'')+'</p><div class="price">'+Number(p.price_iqd).toLocaleString('ar-IQ')+' د.ع</div><button data-add="'+p.id+'">أضف للسلة</button></div></article>').join(''):'<div class="empty">لا توجد أصناف متاحة في هذا القسم حالياً</div>'}
function updateCart(){const count=Object.values(cart).reduce((a,b)=>a+b,0);document.getElementById('cartText').textContent=count?count+' أصناف في السلة':'السلة فارغة';document.getElementById('checkout').disabled=!count}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));render(b.dataset.cat)});
menuEl.addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(!b)return;cart[b.dataset.add]=(cart[b.dataset.add]||0)+1;updateCart()});
document.getElementById('checkout').onclick=()=>alert('سيتم تفعيل الدفع وإرسال الطلب بعد استكمال مسار المنيو العام والتحقق من صلاحيات الوصول. لم يتم إرسال أي طلب.');
async function init(){
 const {data:rest,error:re}=await db.from('restaurant_public').select('*').eq('slug',slug).maybeSingle();
 if(re||!rest){document.getElementById('intro').textContent='تعذر العثور على منيو منشور لهذا المطعم. قد تكون واجهة العرض العامة قيد الربط.';menuEl.innerHTML='<div class="empty">المنيو غير متاح حالياً</div>';return}
 document.getElementById('name').textContent=rest.restaurant_name||rest.name||'مطعم';document.getElementById('tagline').textContent=rest.tagline||'منيو إلكتروني';
 document.documentElement.style.setProperty('--brand',rest.primary_color||'#c90019');document.documentElement.style.setProperty('--accent',rest.accent_color||'#178447');
 const [c,p]=await Promise.all([db.from('menu_categories').select('id,name,sort_order').eq('restaurant_id',rest.id).eq('is_active',true).order('sort_order'),db.from('menu_products').select('id,name,description,price_iqd,image_url,category_id,is_available,sort_order').eq('restaurant_id',rest.id).eq('is_available',true).order('sort_order')]);
 if(c.error||p.error){document.getElementById('intro').textContent=(c.error||p.error).message;return}
 categories=c.data||[];products=p.data||[];
 document.getElementById('tabs').innerHTML='<button class="active" data-cat="all">الكل</button>'+categories.map(x=>'<button data-cat="'+x.id+'">'+esc(x.name)+'</button>').join('');
 render();updateCart();
}
init();
</script></body></html>
