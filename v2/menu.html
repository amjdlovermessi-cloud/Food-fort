<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2b"><title>Nexora Studio V2 | المنيو</title>
<style>
:root{--brand:#c90019;--accent:#178447;--bg:#f5f6f7;--ink:#202938;--muted:#788394}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}.hero{background:linear-gradient(125deg,#101b2b,#243b52);color:#fff;padding:36px 18px 28px;text-align:center}.logo{font-size:27px;font-weight:900}.hero p{color:#d4dce5;font-size:12px}.wrap{max-width:1000px;margin:auto;padding:18px}.banner{background:#fff;border-radius:14px;padding:18px;margin-top:-12px;box-shadow:0 8px 30px #101b2b0c}.notice{color:var(--muted);font-size:12px;line-height:1.8}.tabs{display:flex;gap:8px;overflow:auto;padding:17px 0;position:sticky;top:0;background:var(--bg);z-index:3}.tabs button{white-space:nowrap;border:0;border-radius:22px;padding:10px 15px;background:#fff;color:#394456;font-weight:bold}.tabs button.active{background:var(--brand);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}.item{background:#fff;border-radius:15px;overflow:hidden;border:1px solid #e9edf1}.menu-list .item{display:grid;grid-template-columns:180px 1fr;align-items:center}.menu-list .item img,.menu-list .item>div:first-child{height:100%;min-height:150px}.menu-compact{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:9px}.card-bordered .item{border:2px solid var(--accent);box-shadow:none}.card-minimal .item{border:0;box-shadow:none;border-radius:5px}.card-soft .item{box-shadow:0 8px 25px #101b2b0b;border-color:transparent}.font-tajawal{font-family:Tahoma,Arial,sans-serif}.font-cairo{font-family:"Cairo",Tahoma,Arial,sans-serif}.font-system{font-family:system-ui,Arial,sans-serif}.font-serif{font-family:Georgia,serif}.item img{width:100%;height:145px;object-fit:cover;background:#e9edf1}.itembody{padding:13px}.item h3{font-size:15px;margin:0 0 7px}.item p{font-size:11px;color:var(--muted);line-height:1.6;min-height:34px}.price{font-size:16px;font-weight:900;color:var(--brand)}.item button{width:100%;margin-top:10px;background:var(--brand);color:#fff;border:0;border-radius:9px;padding:10px;font-weight:bold}.empty{text-align:center;background:#fff;border-radius:14px;padding:40px 15px;color:var(--muted)}.cart{position:fixed;bottom:14px;left:14px;right:14px;max-width:600px;margin:auto;background:#101b2b;color:#fff;border-radius:14px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 30px #0003}.cart button{background:#fff;color:#101b2b;border:0;border-radius:9px;padding:9px 13px;font-weight:bold}.modal{position:fixed;inset:0;background:#0d1725aa;display:none;align-items:center;justify-content:center;padding:15px;z-index:9}.modal.open{display:flex}.dialog{background:#fff;border-radius:17px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:20px}.dialog h2{font-size:18px;margin:0 0 14px}.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #dfe5eb;border-radius:9px}.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1;border:0;border-radius:9px;padding:12px;font-weight:bold}.primary{background:var(--brand);color:#fff}.secondary{background:#eef1f5;color:#27364a}.msg{font-size:12px;line-height:1.8;color:#586579;margin-top:10px}@media(max-width:560px){.wrap{padding:12px}.hero{padding:28px 15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item img{height:112px}.itembody{padding:10px}.item h3{font-size:13px}.item p{font-size:10px}}
</style></head><body><header class="hero" id="hero"><img id="brandLogo" alt="شعار المطعم" style="display:none;width:78px;height:78px;object-fit:contain;border-radius:18px;background:#ffffff20;padding:7px;margin-bottom:10px"><div class="logo" id="name">Nexora Studio</div><p id="tagline">قائمة الطعام الرقمية</p></header><main class="wrap"><div class="banner"><b>أهلاً بك 👋</b><p class="notice" id="intro">اختر الأصناف التي ترغب بها وأرسل طلبك مباشرة للمطعم.</p></div><nav class="tabs" id="tabs"></nav><div id="menu" class="grid"></div></main><div class="cart"><span id="cartText">السلة فارغة</span><button id="checkout" disabled>إتمام الطلب</button></div>
<div class="modal" id="modal"><div class="dialog"><h2>إكمال الطلب</h2><div id="summary" class="msg"></div><form id="checkoutForm"><div class="field"><label>الاسم</label><input id="customerName" required minlength="2" maxlength="60"></div><div class="field"><label>رقم الهاتف</label><input id="customerPhone" required minlength="7" maxlength="20" inputmode="tel"></div><div class="field"><label>نوع الطلب</label><select id="orderType"><option value="takeaway">سفري</option><option value="dine_in">داخل المطعم</option></select></div><div class="field" id="tableField" style="display:none"><label>رقم الطاولة</label><input id="tableNumber" type="number" min="1" max="100"></div><div class="field"><label>طريقة الدفع</label><select id="paymentMethod" required></select></div><div class="actions"><button class="primary" type="submit" id="sendOrder">إرسال الطلب</button><button class="secondary" type="button" id="closeModal">إلغاء</button></div></form><div class="msg" id="checkoutMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://gghlmpxmiivrkiltydxf.supabase.co","sb_publishable_-oLYi0Su5SXOGmQBuZcvcw_TIHJ1D8h");const orderAuth=window.supabase.createClient("https://gghlmpxmiivrkiltydxf.supabase.co","sb_publishable_-oLYi0Su5SXOGmQBuZcvcw_TIHJ1D8h",{auth:{storageKey:"nexora-public-order-auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const slug=new URLSearchParams(location.search).get('restaurant')||'food-fort';const $=id=>document.getElementById(id);let restaurant=null,categories=[],products=[],payments=[],cart={};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const money=n=>Number(n||0).toLocaleString('ar-IQ')+' د.ع';
function render(filter='all'){const rows=products.filter(p=>p.is_available&&(filter==='all'||p.category_id===filter));$('menu').innerHTML=rows.length?rows.map(p=>{const sizes=Array.isArray(p.size_options)?p.size_options:[];const picker=sizes.length?'<div class="field"><select id="size-'+p.id+'">'+sizes.map((s,i)=>'<option value="'+esc(s.name)+'" data-price="'+Number(s.price_iqd)+'">'+esc(s.name)+' · '+money(s.price_iqd)+'</option>').join('')+'</select></div>':'';return '<article class="item">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="">':'<div style="height:145px;background:#edf0f3"></div>')+'<div class="itembody"><h3>'+esc(p.name)+'</h3><p>'+esc(p.description||'')+'</p><div class="price">'+(sizes.length?'اختر الحجم':money(p.price_iqd))+'</div>'+picker+'<button data-add="'+p.id+'">أضف للسلة</button></div></article>'}).join(''):'<div class="empty">لا توجد أصناف متاحة في هذا القسم حالياً</div>'}
function updateCart(){const entries=Object.values(cart);const count=entries.reduce((a,x)=>a+x.qty,0);const total=entries.reduce((s,x)=>s+x.unitPrice*x.qty,0);$('cartText').textContent=count?count+' أصناف · '+money(total):'السلة فارغة';$('checkout').disabled=!count||!payments.length}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));render(b.dataset.cat)});
$('menu').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(!b)return;const p=products.find(x=>x.id===b.dataset.add);if(!p)return;const sizes=Array.isArray(p.size_options)?p.size_options:[];let sizeName=null,unitPrice=Number(p.price_iqd);if(sizes.length){const select=$('size-'+p.id);sizeName=select.value;unitPrice=Number(sizes.find(s=>s.name===sizeName)?.price_iqd);if(!Number.isFinite(unitPrice)){return}}const key=p.id+'::'+(sizeName||'');cart[key]=cart[key]||{product:p,sizeName,qty:0,unitPrice};cart[key].qty++;updateCart()});
$('checkout').onclick=()=>{$('summary').textContent=Object.values(cart).map(x=>x.product.name+(x.sizeName?' ('+x.sizeName+')':'')+' × '+x.qty).join('، ');$('modal').classList.add('open');$('checkoutMsg').textContent='';};
$('closeModal').onclick=()=>$('modal').classList.remove('open');$('orderType').onchange=()=>$('tableField').style.display=$('orderType').value==='dine_in'?'block':'none';
$('checkoutForm').onsubmit=async e=>{e.preventDefault();$('sendOrder').disabled=true;$('checkoutMsg').textContent='جارٍ إرسال الطلب...';
try{let {data:{session:orderSession}}=await orderAuth.auth.getSession();if(orderSession&&!orderSession.user?.is_anonymous){await orderAuth.auth.signOut({scope:'local'});orderSession=null}if(!orderSession){const {data:anonData,error:anonError}=await orderAuth.auth.signInAnonymously();if(anonError)throw new Error('تعذر إنشاء جلسة طلب للزبون: '+anonError.message+'، تحقق من تفعيل Anonymous Sign-Ins في Supabase.');orderSession=anonData.session}if(!orderSession?.access_token||orderSession.user?.is_anonymous!==true)throw new Error('لم يتم إنشاء جلسة طلب مجهولة صالحة. أعد تحميل الصفحة وحاول مجدداً.');
const items=Object.values(cart).map(x=>({product_id:x.product.id,size_name:x.sizeName,qty:x.qty}));
const {data,error}=await orderAuth.rpc('create_restaurant_order',{p_restaurant_slug:slug,p_customer_name:$('customerName').value.trim(),p_customer_phone:$('customerPhone').value.trim(),p_order_type:$('orderType').value,p_table_number:$('orderType').value==='dine_in'?Number($('tableNumber').value):null,p_items:items,p_discount_code:null,p_payment_method_id:$('paymentMethod').value});
if(error)throw error;const order=data?.[0];$('checkoutMsg').innerHTML='تم استلام طلبك بنجاح. رقم الطلب: <b>#'+(order?.order_number??'تم الإنشاء')+'</b>. <a href="track-order.html?order='+encodeURIComponent(order?.id||'')+'">متابعة الطلب</a>';cart={};updateCart();$('checkoutForm').reset();$('tableField').style.display='none';
}catch(err){$('checkoutMsg').textContent=err.message||'تعذر إرسال الطلب، حاول مرة أخرى.'}finally{$('sendOrder').disabled=false}}
async function init(){const {data:rest,error:re}=await db.from('restaurant_public').select('id,slug,restaurant_name,tagline,logo_url,primary_color,accent_color,theme_key,phone,address,status').eq('slug',slug).maybeSingle();if(re||!rest||rest.status!=='active'){$('intro').textContent=re?.message||'المنيو غير متاح حالياً لهذا المطعم.';$('menu').innerHTML='<div class="empty">المنيو غير متاح حالياً</div>';return}
restaurant=rest;$('name').textContent=rest.restaurant_name;$('tagline').textContent=rest.tagline||'منيو إلكتروني';document.documentElement.style.setProperty('--brand',rest.primary_color||'#c90019');document.documentElement.style.setProperty('--accent',rest.accent_color||'#178447');document.documentElement.style.setProperty('--bg',rest.background_color||'#f5f6f7');document.body.classList.add('font-'+(rest.font_family||'tajawal'),'card-'+(rest.card_style||'soft'));$('menu').classList.toggle('menu-list',rest.menu_layout==='list');$('menu').classList.toggle('menu-compact',rest.menu_layout==='compact');if(rest.logo_url){$('brandLogo').src=rest.logo_url;$('brandLogo').style.display='inline-block'}if(rest.hero_style==='solid')$('hero').style.background=rest.primary_color||'#101b2b';else if(rest.hero_style==='image'&&rest.cover_image_url)$('hero').style.background='linear-gradient(#101b2b77,#101b2bcc),url("'+rest.cover_image_url.replace(/"/g,'%22')+'") center/cover';else $('hero').style.background='linear-gradient(125deg,'+(rest.primary_color||'#101b2b')+','+(rest.accent_color||'#243b52')+')';
const [c,p,m]=await Promise.all([db.from('menu_categories').select('id,name,sort_order').eq('restaurant_id',rest.id).eq('is_active',true).order('sort_order'),db.from('menu_products').select('id,name,description,price_iqd,image_url,category_id,is_available,sort_order,size_options').eq('restaurant_id',rest.id).eq('is_available',true).order('sort_order'),db.from('restaurant_payment_methods').select('id,method_name,method_type,require_proof').eq('restaurant_id',rest.id).eq('is_enabled',true).order('sort_order')]);
if(c.error||p.error||m.error){$('intro').textContent=(c.error||p.error||m.error).message;return}categories=c.data||[];products=p.data||[];payments=m.data||[];
$('tabs').innerHTML='<button class="active" data-cat="all">الكل</button>'+categories.map(x=>'<button data-cat="'+x.id+'">'+esc(x.name)+'</button>').join('');
$('paymentMethod').innerHTML=payments.map(x=>'<option value="'+x.id+'">'+esc(x.method_name)+'</option>').join('');if(!payments.length){$('checkout').disabled=true;$('intro').textContent='لا توجد وسيلة دفع مفعّلة لهذا المطعم حالياً.'}
render();updateCart();}
init();
</script></body></html>
