<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2b"><title>Food Fort V2 | هوية المطاعم</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172437;font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{border:0;border-radius:9px;padding:11px 14px;background:#101b2b;color:#fff;font-weight:bold}.wrap{max-width:900px;margin:auto;padding:22px}.panel,.top{background:#fff;border:1px solid #e5eaf0;border-radius:15px;padding:18px;margin-bottom:15px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;font-size:17px}.muted{font-size:11px;color:#778497;line-height:1.8}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #dfe5eb;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field input[type=color]{height:43px;padding:4px}.preview{border-radius:13px;padding:18px;color:#fff;min-height:110px}.login{max-width:400px;margin:9vh auto;background:#fff;border:1px solid #e5eaf0;border-radius:15px;padding:25px}.login .field{margin:12px 0}.hidden{display:none!important}.status{font-size:11px;color:#778497;margin-top:10px}@media(max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}}
</style></head><body><div id="login" class="login"><div class="brand">FOOD FORT · V2</div><h2>إعداد هوية المطاعم</h2><p class="muted">صلاحية المورّد فقط. تغيير اسم المطعم وشعاره وألوانه وثيمه.</p><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password"></div><button id="loginBtn" style="width:100%">تسجيل الدخول</button><div id="loginMsg" class="status"></div></div>
<div id="app" class="hidden"><main class="wrap"><header class="top"><div><div class="brand">هوية المطاعم</div><div class="muted">إدارة العلامة التجارية لكل مطعم</div></div><a href="platform.html">لوحة المورّد</a></header><section class="panel"><div class="field"><label>اختيار المطعم</label><select id="restaurant"></select></div><form id="form"><div class="grid"><div class="field"><label>اسم المطعم</label><input id="name" required maxlength="100"></div><div class="field"><label>الرابط المختصر (Slug)</label><input id="slug" required pattern="[a-z0-9][a-z0-9-]{1,48}[a-z0-9]"></div><div class="field"><label>عبارة تعريفية</label><input id="tagline" maxlength="160"></div><div class="field"><label>رابط الشعار</label><input id="logo" type="url"></div><div class="field"><label>اللون الأساسي</label><input id="primary" type="color"></div><div class="field"><label>اللون المساعد</label><input id="accent" type="color"></div><div class="field"><label>الثيم</label><select id="theme"><option value="classic">Classic</option><option value="dark">Dark</option><option value="warm">Warm</option><option value="minimal">Minimal</option></select></div><div class="field"><label>رقم الهاتف</label><input id="phone"></div><div class="field"><label>العنوان</label><input id="address"></div></div><div class="preview" id="preview"><b id="previewName">اسم المطعم</b><p id="previewTagline">عبارة المطعم</p></div><button type="submit">حفظ الهوية</button></form><div id="status" class="status"></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://gghlmpxmiivrkiltydxf.supabase.co","sb_publishable_-oLYi0Su5SXOGmQBuZcvcw_TIHJ1D8h");const $=id=>document.getElementById(id);let list=[];
$('loginBtn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginMsg').textContent=error?.message||'';if(!error)boot()};
async function boot(){const {data:{user}}=await db.auth.getUser();if(!user)return;const {data:admin}=await db.from('platform_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(!admin){$('loginMsg').textContent='الحساب ليس مورّداً معتمداً.';await db.auth.signOut();return}$('login').classList.add('hidden');$('app').classList.remove('hidden');const {data,error}=await db.from('restaurants').select('id,restaurant_name,slug,tagline,logo_url,primary_color,accent_color,theme_key,phone,address').order('restaurant_name');if(error){$('status').textContent=error.message;return}list=data||[];$('restaurant').innerHTML=list.map(x=>'<option value="'+x.id+'">'+x.restaurant_name+'</option>').join('');if(list.length)load()}
function load(){const r=list.find(x=>x.id===$('restaurant').value)||list[0];if(!r)return;for(const [id,key] of Object.entries({name:'restaurant_name',slug:'slug',tagline:'tagline',logo:'logo_url',primary:'primary_color',accent:'accent_color',theme:'theme_key',phone:'phone',address:'address'}))$(id).value=r[key]||({primary:'#c90019',accent:'#178447'}[id]||'');paint()}
function paint(){$('preview').style.background='linear-gradient(120deg,'+$('primary').value+','+$('accent').value+')';$('previewName').textContent=$('name').value||'اسم المطعم';$('previewTagline').textContent=$('tagline').value||'عبارة المطعم'}
$('restaurant').onchange=load;['name','tagline','primary','accent'].forEach(id=>$(id).oninput=paint);
$('form').onsubmit=async e=>{e.preventDefault();const id=$('restaurant').value;const payload={restaurant_name:$('name').value.trim(),slug:$('slug').value.trim(),tagline:$('tagline').value.trim(),logo_url:$('logo').value.trim()||null,primary_color:$('primary').value,accent_color:$('accent').value,theme_key:$('theme').value,phone:$('phone').value.trim()||null,address:$('address').value.trim()||null};const {error}=await db.from('restaurants').update(payload).eq('id',id);$('status').textContent=error?.message||'تم حفظ الهوية.';if(!error){const r=list.find(x=>x.id===id);Object.assign(r,payload)}};
db.auth.getSession().then(({data})=>{if(data.session)boot()});
</script></body></html>
