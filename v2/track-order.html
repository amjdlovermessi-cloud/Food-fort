<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2b"><title>Nexora Studio V2 | تتبع الطلب</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#172437;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:650px;margin:8vh auto;padding:15px}.card{background:#fff;border:1px solid #e5eaf0;border-radius:17px;padding:22px}.brand{font-weight:900;font-size:18px}.muted{color:#778497;font-size:12px;line-height:1.8}.number{font-size:28px;font-weight:900;margin:18px 0}.status{display:inline-block;background:#eaf7f5;color:#087f77;padding:8px 12px;border-radius:20px;font-size:12px}.line{border-top:1px solid #edf0f3;padding:12px 0;font-size:13px;display:flex;justify-content:space-between;gap:10px}button{border:0;border-radius:9px;padding:11px 14px;background:#101b2b;color:#fff;font-weight:bold}a{color:#087f77}.hidden{display:none}</style></head><body><main class="wrap"><section class="card"><div class="brand">NEXORA STUDIO <span class="muted">V2 · تتبع الطلب</span></div><h1 style="font-size:21px">حالة طلبك</h1><p class="muted">تعرض هذه الصفحة تفاصيل الطلب المرتبط بجلسة المتصفح التي أرسلته.</p><div id="result" class="muted">جارٍ تحميل الطلب...</div><p><a href="menu.html">العودة إلى المنيو</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://gghlmpxmiivrkiltydxf.supabase.co","sb_publishable_-oLYi0Su5SXOGmQBuZcvcw_TIHJ1D8h");const id=new URLSearchParams(location.search).get('order');const el=document.getElementById('result');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){if(!id){el.textContent='رابط التتبع غير مكتمل.';return}const {data:{session}}=await db.auth.getSession();if(!session){el.textContent='افتح رابط التتبع من نفس المتصفح الذي أرسلت منه الطلب حتى تبقى جلسة الطلب متاحة.';return}
const {data:o,error}=await db.from('orders').select('id,order_number,customer_name,total_iqd,status,payment_status,created_at').eq('id',id).maybeSingle();if(error||!o){el.textContent=error?.message||'لم نعثر على الطلب ضمن جلسة المستخدم الحالية.';return}
const {data:items}=await db.from('order_items').select('product_name,unit_price,quantity,line_total').eq('order_id',id);
const states={new:'تم استلام الطلب',preparing:'قيد التحضير',ready:'الطلب جاهز',completed:'مكتمل',cancelled:'ملغي'};
el.innerHTML='<div class="number">#'+o.order_number+'</div><span class="status">'+(states[o.status]||esc(o.status))+'</span><div class="line"><span>الاسم</span><b>'+esc(o.customer_name)+'</b></div><div class="line"><span>حالة الدفع</span><b>'+esc(o.payment_status)+'</b></div>'+(items||[]).map(x=>'<div class="line"><span>'+esc(x.product_name)+' × '+x.quantity+'</span><b>'+Number(x.line_total).toLocaleString('ar-IQ')+' د.ع</b></div>').join('')+'<div class="line"><span>الإجمالي</span><b>'+Number(o.total_iqd).toLocaleString('ar-IQ')+' د.ع</b></div><p class="muted">آخر تحديث: '+new Date(o.created_at).toLocaleString('ar-IQ')+'</p><button onclick="location.reload()">تحديث الحالة</button>'}
load();
</script></body></html>
