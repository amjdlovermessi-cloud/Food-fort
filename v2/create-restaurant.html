<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2b"><title>Food Fort V2 | إضافة مطعم</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172437;font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{border:0;border-radius:9px;padding:12px 15px;background:#101b2b;color:#fff;font-weight:bold;cursor:pointer}.wrap{max-width:850px;margin:auto;padding:22px}.panel,.top,.login{background:#fff;border:1px solid #e5eaf0;border-radius:15px;padding:20px;margin-bottom:15px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:17px;font-weight:900}.muted{font-size:11px;color:#778497;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #dfe5eb;border-radius:9px}.field input[type=color]{height:42px;padding:4px}.login{max-width:400px;margin:9vh auto}.login .field{margin:12px 0}.hidden{display:none!important}.status{font-size:11px;color:#778497;margin-top:12px}.result{padding:12px;background:#eaf7f5;border-radius:10px;color:#17665f;font-size:12px;line-height:1.8;margin-top:12px}@media(max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}}
</style></head><body><div id="login" class="login"><div class="brand">FOOD FORT · V2</div><h2>دخول المورّد</h2><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password"></div><button id="loginBtn" style="width:100%">تسجيل الدخول</button><div id="loginMsg" class="status"></div></div>
<div id="app" class="hidden"><main class="wrap"><header class="top"><div><div class="brand">إضافة مطعم جديد</div><div class="muted">إنشاء مساحة مستقلة وإرسال دعوة المدير</div></div><a href="platform.html">لوحة المورّد</a></header><section class="panel"><form id="form"><div class="grid"><div class="field"><label>اسم المطعم</label><input id="name" required minlength="2" maxlength="100"></div><div class="field"><label>الرابط المختصر بالإنجليزية</label><input id="slug" required pattern="[a-z0-9][a-z0-9-]{1,48}[a-z0-9]" placeholder="restaurant-name"></div><div class="field"><label>بريد مدير المطعم</label><input id="manager" type="email" required></div><div class="field"><label>العبارة التعريفية</label><input id="tagline" maxlength="160"></div><div class="field"><label>رابط الشعار</label><input id="logo" type="url"></div><div class="field"><label>الثيم</label><select id="theme"><option value="classic">Classic</option><option value="dark">Dark</option><option value="warm">Warm</option><option value="minimal">Minimal</option></select></div><div class="field"><label>اللون الأساسي</label><input id="primary" type="color" value="#c90019"></div><div class="field"><label>اللون المساعد</label><input id="accent" type="color" value="#178447"></div></div><button id="submit" type="submit">إنشاء المطعم وإرسال الدعوة</button></form><div id="status" class="status"></div><div id="result" class="result hidden"></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://gghlmpxmiivrkiltydxf.supabase.co","sb_publishable_-oLYi0Su5SXOGmQBuZcvcw_TIHJ1D8h");const $=id=>document.getElementById(id);
$('loginBtn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginMsg').textContent=error?.message||'';if(!error)boot()};
async function boot(){const {data:{user}}=await db.auth.getUser();if(!user)return;const {data:admin}=await db.from('platform_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(!admin){$('loginMsg').textContent='هذا الحساب ليس مورّداً معتمداً.';await db.auth.signOut();return}$('login').classList.add('hidden');$('app').classList.remove('hidden')}
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('status').textContent='جارٍ إنشاء المطعم وإرسال الدعوة...';$('result').classList.add('hidden');const body={restaurant_name:$('name').value.trim(),slug:$('slug').value.trim().toLowerCase(),manager_email:$('manager').value.trim(),tagline:$('tagline').value.trim(),logo_url:$('logo').value.trim()||null,primary_color:$('primary').value,accent_color:$('accent').value,theme_key:$('theme').value};const {data,error}=await db.functions.invoke('create-restaurant',{body});$('submit').disabled=false;if(error){$('status').textContent=error.message;return}if(data?.error){$('status').textContent=data.error;return}$('status').textContent='تم إنشاء المطعم.';$('result').classList.remove('hidden');$('result').innerHTML='تم إنشاء <b>'+data.restaurant.restaurant_name+'</b>.<br>مدير المطعم: '+data.manager_email+'<br>حالة الدعوة: '+(data.manager_invited?'أُرسلت الدعوة بالبريد':'الحساب مسجل مسبقاً')+'<br><a href="menu.html?restaurant='+encodeURIComponent(data.restaurant.slug)+'">رابط المنيو V2</a><br><a href="restaurant.html">لوحة المطعم V2</a>';$('form').reset()};
db.auth.getSession().then(({data})=>{if(data.session)boot()});
</script></body></html>
