<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2b"><title>Nexora Studio V2 | إدارة القوائم</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172437;font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;padding:10px 13px;background:#101b2b;color:#fff;font-weight:bold;cursor:pointer}.ghost{background:#edf1f5;color:#344258}.danger{background:#fff0f0;color:#b42332}.wrap{max-width:1250px;margin:auto;padding:22px}.top,.panel,.login{background:#fff;border:1px solid #e5eaf0;border-radius:15px}.top{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:17px;font-weight:900}.muted{font-size:11px;color:#778497;line-height:1.8}.panel{padding:18px;margin-top:15px}.panel h2{font-size:15px;margin:0 0 13px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.field{flex:1;min-width:170px}.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #dfe5eb;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:right;padding:11px;border-bottom:1px solid #edf0f3;font-size:11px}th{color:#778497}.login{max-width:400px;margin:9vh auto;padding:25px}.login h1{font-size:21px}.login .field{margin:12px 0}.status{font-size:11px;color:#778497;margin-top:10px}.hidden{display:none!important}.pill{background:#eaf7f5;color:#087f77;border-radius:20px;padding:5px 9px;font-size:10px}@media(max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.field{min-width:100%}}
</style></head><body><div id="login" class="login"><div class="brand">NEXORA STUDIO · V2</div><h1>إدارة قوائم المنصة</h1><p class="muted">هذه الصفحة للمورّد فقط. تتيح إدارة قوائم وأسعار جميع المطاعم.</p><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password"></div><button id="loginBtn" style="width:100%">تسجيل الدخول</button><div id="loginMsg" class="status"></div></div>
<div id="app" class="hidden"><div class="wrap"><header class="top"><div><div class="brand">إدارة القوائم والأسعار</div><div class="muted">صلاحيات المورّد · جميع المطاعم</div></div><div class="row"><a href="platform.html" class="muted">لوحة المورّد</a><button class="ghost" id="logout">خروج</button></div></header>
<section class="panel"><h2>اختيار المطعم</h2><div class="row"><div class="field"><label>المطعم</label><select id="restaurantSelect"></select></div><div class="field"><label>القسم</label><select id="categoryFilter"></select></div></div><div id="loadMsg" class="status"></div></section>
<section class="panel"><h2 id="formTitle">إضافة صنف جديد</h2><form id="productForm"><input id="productId" type="hidden"><div class="grid"><div class="field"><label>اسم الصنف</label><input id="productName" required maxlength="160"></div><div class="field"><label>القسم</label><select id="productCategory" required></select></div><div class="field"><label>السعر بالدينار العراقي</label><input id="productPrice" type="number" min="0" max="10000000" required></div><div class="field"><label>رابط الصورة</label><input id="productImage" type="file" accept="image/*"><img id="productImagePreview" alt="معاينة صورة الصنف" style="display:none;max-width:130px;max-height:100px;object-fit:cover;margin-top:8px;border-radius:9px"></div></div><div class="field" style="margin-top:10px"><label>الوصف</label><textarea id="productDescription" style="width:100%;padding:11px;border:1px solid #dfe5eb;border-radius:9px"></textarea></div><div class="row"><button>حفظ الصنف</button><button type="button" class="ghost" id="clear">إلغاء التعديل</button></div></form></section>
<section class="panel"><h2>الأصناف</h2><div id="productsBox" class="tablewrap muted">اختر مطعماً لعرض قائمته.</div></section><div id="status" class="status"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://gghlmpxmiivrkiltydxf.supabase.co","sb_publishable_-oLYi0Su5SXOGmQBuZcvcw_TIHJ1D8h");const $=id=>document.getElementById(id);let restaurants=[],categories=[],products=[],restaurantId=null,currentProductImageUrl=null;
async function uploadNexoraImage(file,path){if(!file)return null;if(!file.type.startsWith('image/'))throw new Error('اختر ملف صورة صالحاً.');if(file.size>5*1024*1024)throw new Error('حجم الصورة يجب ألا يتجاوز 5 ميغابايت.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const objectPath=path+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,9)+'.'+ext;const {data,error}=await db.storage.from('nexora-media').upload(objectPath,file,{contentType:file.type,cacheControl:'3600',upsert:false});if(error)throw error;return db.storage.from('nexora-media').getPublicUrl(data.path).data.publicUrl}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const money=n=>Number(n||0).toLocaleString('ar-IQ')+' د.ع';
$('loginBtn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginMsg').textContent=error?.message||'تم الدخول.';if(!error)boot()};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
async function boot(){const {data:{user}}=await db.auth.getUser();if(!user)return;const {data:admin,error}=await db.from('platform_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!admin){$('loginMsg').textContent=error?.message||'هذا الحساب ليس حساب مورّد.';await db.auth.signOut();return}
$('login').classList.add('hidden');$('app').classList.remove('hidden');const r=await db.from('restaurants').select('id,restaurant_name,slug').order('restaurant_name');if(r.error){$('status').textContent=r.error.message;return}restaurants=r.data||[];$('restaurantSelect').innerHTML=restaurants.map(x=>'<option value="'+x.id+'">'+esc(x.restaurant_name)+' · '+esc(x.slug)+'</option>').join('');if(restaurants.length){restaurantId=restaurants[0].id;await loadCatalog()}}
async function loadCatalog(){restaurantId=$('restaurantSelect').value;const [c,p]=await Promise.all([db.from('menu_categories').select('id,name,is_active').eq('restaurant_id',restaurantId).order('name'),db.from('menu_products').select('id,name,description,price_iqd,image_url,category_id,is_available').eq('restaurant_id',restaurantId).order('name')]);if(c.error||p.error){$('loadMsg').textContent=(c.error||p.error).message;return}categories=c.data||[];products=p.data||[];const opts=categories.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');$('productCategory').innerHTML=opts;$('categoryFilter').innerHTML='<option value="all">كل الأقسام</option>'+opts;render()}
function render(){const filter=$('categoryFilter').value||'all';const rows=products.filter(p=>filter==='all'||p.category_id===filter);$('productsBox').innerHTML=rows.length?'<table><thead><tr><th>الصنف</th><th>القسم</th><th>السعر</th><th>التوفر</th><th>إجراء</th></tr></thead><tbody>'+rows.map(p=>'<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(categories.find(c=>c.id===p.category_id)?.name||'')+'</td><td>'+money(p.price_iqd)+'</td><td>'+(p.is_available?'متاح':'مخفي')+'</td><td><button class="ghost" data-edit="'+p.id+'">تعديل</button> <button class="ghost" data-availability="'+p.id+'">'+(p.is_available?'إخفاء':'إظهار')+'</button> <button class="danger" data-delete="'+p.id+'">حذف</button></td></tr>').join('')+'</tbody></table>':'لا توجد أصناف في هذا القسم.'}
$('restaurantSelect').onchange=loadCatalog;$('categoryFilter').onchange=render;
$('productForm').onsubmit=async e=>{e.preventDefault();const id=$('productId').value;try{const selected=$('productImage').files[0];if(selected)currentProductImageUrl=await uploadNexoraImage(selected,restaurantId+'/products');const payload={name:$('productName').value.trim(),description:$('productDescription').value.trim()||null,price_iqd:Number($('productPrice').value),image_url:currentProductImageUrl,category_id:$('productCategory').value};const q=id?db.from('menu_products').update(payload).eq('id',id).eq('restaurant_id',restaurantId):db.from('menu_products').insert({...payload,restaurant_id:restaurantId});const {error}=await q;if(error)throw error;$('productForm').reset();$('productId').value='';currentProductImageUrl=null;$('productImagePreview').style.display='none';$('formTitle').textContent='إضافة صنف جديد';await loadCatalog();$('status').textContent='تم حفظ الصنف والصورة.'}catch(err){$('status').textContent=err.message||'تعذر حفظ الصنف.'}};
$('clear').onclick=()=>{$('productForm').reset();$('productId').value='';currentProductImageUrl=null;$('productImagePreview').style.display='none';$('formTitle').textContent='إضافة صنف جديد'};
$('productImage').onchange=()=>{const f=$('productImage').files[0];if(f){$('productImagePreview').src=URL.createObjectURL(f);$('productImagePreview').style.display='block'}};
document.addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]');if(edit){const p=products.find(x=>x.id===edit.dataset.edit);$('productId').value=p.id;$('productName').value=p.name;$('productCategory').value=p.category_id;$('productPrice').value=p.price_iqd;currentProductImageUrl=p.image_url||null;$('productImage').value='';$('productImagePreview').src=p.image_url||'';$('productImagePreview').style.display=p.image_url?'block':'none';$('productDescription').value=p.description||'';$('formTitle').textContent='تعديل الصنف'}
const av=e.target.closest('[data-availability]');if(av){const p=products.find(x=>x.id===av.dataset.availability);const {error}=await db.from('menu_products').update({is_available:!p.is_available}).eq('id',p.id).eq('restaurant_id',restaurantId);if(error)$('status').textContent=error.message;else await loadCatalog()}
const del=e.target.closest('[data-delete]');if(del&&confirm('حذف الصنف نهائياً من قائمة هذا المطعم؟')){const {error}=await db.from('menu_products').delete().eq('id',del.dataset.delete).eq('restaurant_id',restaurantId);if(error)$('status').textContent=error.message;else await loadCatalog()}
});
db.auth.getSession().then(({data})=>{if(data.session)boot()});
</script></body></html>
