<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Fort V2 | دعوة فريق المطعم</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172437;font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{border:0;border-radius:9px;padding:11px 14px;background:#101b2b;color:#fff;font-weight:bold}.wrap{max-width:700px;margin:auto;padding:22px}.panel,.login{background:#fff;border:1px solid #e5eaf0;border-radius:15px;padding:20px}.login{max-width:400px;margin:9vh auto}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #dfe5eb;border-radius:9px}.muted,.status{font-size:11px;color:#778497;line-height:1.8}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}@media(max-width:600px){.wrap{padding:12px}}
</style></head><body><div id="login" class="login"><b>FOOD FORT · V2</b><h2>دخول المورّد</h2><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password"></div><button id="loginBtn" style="width:100%">تسجيل الدخول</button><div id="loginMsg" class="status"></div></div>
<div id="app" class="hidden"><main class="wrap"><header class="top"><div><b>إدارة فريق المطاعم</b><div class="muted">إضافة مدير أو كاشير</div></div><a href="platform.html">لوحة المورّد</a></header><section class="panel"><form id="form"><div class="field"><label>المطعم</label><select id="restaurant" required></select></div><div class="field"><label>البريد الإلكتروني للموظف</label><input id="emailMember" type="email" required></div><div class="field"><label>الصلاحية</label><select id="role"><option value="restaurant_admin">مدير مطعم</option><option value="cashier">كاشير</option></select></div><button id="send">إرسال الدعوة</button></form><div id="status" class="status"></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://gghlmpxmiivrkiltydxf.supabase.co","sb_publishable_-oLYi0Su5SXOGmQBuZcvcw_TIHJ1D8h");const $=id=>document.getElementById(id);
$('loginBtn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginMsg').textContent=error?.message||'';if(!error)boot()};
async function boot(){const {data:{user}}=await db.auth.getUser();if(!user)return;const {data:admin}=await db.from('platform_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(!admin){$('loginMsg').textContent='هذا الحساب ليس مورّداً معتمداً.';await db.auth.signOut();return}$('login').classList.add('hidden');$('app').classList.remove('hidden');const {data,error}=await db.from('restaurants').select('id,restaurant_name,slug').order('restaurant_name');if(error){$('status').textContent=error.message;return}$('restaurant').innerHTML=(data||[]).map(x=>'<option value="'+x.id+'">'+x.restaurant_name+' · '+x.slug+'</option>').join('')}
$('form').onsubmit=async e=>{e.preventDefault();$('send').disabled=true;$('status').textContent='جارٍ إرسال الدعوة...';const {data,error}=await db.functions.invoke('invite-restaurant-member',{body:{restaurant_id:$('restaurant').value,email:$('emailMember').value.trim(),role:$('role').value}});$('send').disabled=false;$('status').textContent=error?.message||data?.error||('تمت إضافة '+data?.email+' بصلاحية '+data?.role+'. '+(data?.invited?'أُرسلت دعوة الدخول.':'الحساب موجود مسبقاً.'));};
db.auth.getSession().then(({data})=>{if(data.session)boot()});
</script></body></html>
