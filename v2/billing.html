<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexora Studio V2 | الاشتراكات والدفع</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172437;font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;padding:10px 13px;background:#101b2b;color:#fff;font-weight:bold}.ghost{background:#edf1f5;color:#344258}.wrap{max-width:1100px;margin:auto;padding:22px}.top,.panel,.login{background:#fff;border:1px solid #e5eaf0;border-radius:15px;padding:18px;margin-bottom:15px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:17px}.muted,.status{font-size:11px;color:#778497;line-height:1.8}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{background:#e9edf2;color:#344258}.tabs button.active{background:#101b2b;color:#fff}.field{margin:10px 0;flex:1;min-width:150px}.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #dfe5eb;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:right;padding:11px;border-bottom:1px solid #edf0f3;font-size:11px}th{color:#778497}.login{max-width:400px;margin:9vh auto}.login .field{margin:12px 0}.hidden{display:none!important}@media(max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}}
</style></head><body><div id="login" class="login"><b>NEXORA STUDIO · V2</b><h2>دخول المورّد</h2><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password"></div><button id="loginBtn" style="width:100%">تسجيل الدخول</button><div id="loginMsg" class="status"></div></div>
<div id="app" class="hidden"><main class="wrap"><header class="top"><div><div class="brand">الاشتراكات ووسائل الدفع</div><div class="muted">إعدادات المورّد لكل مطعم</div></div><a href="platform.html">لوحة المورّد</a></header><div class="row"><div class="field"><label>المطعم</label><select id="restaurant"></select></div></div><div class="tabs"><button class="active" data-tab="payments">وسائل الدفع</button><button data-tab="subscriptions">الاشتراك</button></div>
<section id="payments" class="panel"><h2>وسائل الدفع</h2><form id="paymentForm"><input type="hidden" id="paymentId"><div class="grid"><div class="field"><label>اسم الوسيلة</label><input id="methodName" required maxlength="60"></div><div class="field"><label>النوع</label><select id="methodType"><option value="cashier">الدفع عند الكاشير</option><option value="card">بطاقة</option><option value="wallet">محفظة إلكترونية</option><option value="bank_transfer">تحويل مصرفي</option><option value="qr">QR</option><option value="other">أخرى</option></select></div><div class="field"><label>اسم صاحب الحساب</label><input id="accountName"></div><div class="field"><label>بيانات الحساب / الرقم</label><input id="accountDetails"></div><div class="field"><label>رابط صورة QR</label><input id="qrUrl" type="url"></div><div class="field"><label>التعليمات</label><input id="instructions"></div></div><div class="row"><label><input id="enabled" type="checkbox" checked> مفعّلة</label><label><input id="proof" type="checkbox"> تتطلب إثبات دفع</label></div><div class="row" style="margin-top:12px"><button>حفظ وسيلة الدفع</button><button type="button" class="ghost" id="clearPayment">جديد</button></div></form><div id="paymentsBox" class="tablewrap status"></div></section>
<section id="subscriptions" class="panel hidden"><h2>إدارة الاشتراك</h2><form id="subForm"><input type="hidden" id="subId"><div class="grid"><div class="field"><label>الخطة</label><select id="plan" required></select></div><div class="field"><label>الحالة</label><select id="subStatus"><option value="active">نشط</option><option value="pending">معلّق</option><option value="expired">منتهي</option><option value="suspended">موقوف</option><option value="cancelled">ملغي</option></select></div><div class="field"><label>تاريخ البداية</label><input id="starts" type="datetime-local"></div><div class="field"><label>تاريخ الانتهاء (يشمل يوم السماح)</label><input id="ends" type="datetime-local"><small class="muted">الاشتراك الشهري 31 يوماً، والسنوي 366 يوماً. يُحسب تاريخ الانتهاء تلقائياً عند تحديد البداية والخطة.</small></div><div class="field"><label>السعر بالدينار</label><input id="subPrice" type="number" min="0" value="0"></div><div class="field"><label>ملاحظات</label><input id="subNotes"></div></div><div class="row"><button>حفظ الاشتراك</button><button type="button" class="ghost" id="clearSub">جديد</button></div></form><div id="subsBox" class="tablewrap status"></div></section><div id="status" class="status"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://gghlmpxmiivrkiltydxf.supabase.co","sb_publishable_-oLYi0Su5SXOGmQBuZcvcw_TIHJ1D8h");const $=id=>document.getElementById(id);let restaurants=[],payments=[],plans=[],subs=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('loginBtn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginMsg').textContent=error?.message||'';if(!error)boot()};
async function boot(){const {data:{user}}=await db.auth.getUser();if(!user)return;const {data:admin}=await db.from('platform_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(!admin){$('loginMsg').textContent='هذا الحساب ليس مورّداً معتمداً.';await db.auth.signOut();return}$('login').classList.add('hidden');$('app').classList.remove('hidden');const [r,p]=await Promise.all([db.from('restaurants').select('id,restaurant_name').order('restaurant_name'),db.from('subscription_plans').select('id,plan_name,price_iqd,duration_days,is_active').order('price_iqd')]);if(r.error||p.error){$('status').textContent=(r.error||p.error).message;return}restaurants=r.data||[];plans=p.data||[];$('restaurant').innerHTML=restaurants.map(x=>'<option value="'+x.id+'">'+esc(x.restaurant_name)+'</option>').join('');$('plan').innerHTML=plans.map(x=>'<option value="'+x.id+'">'+esc(x.plan_name)+' · '+x.duration_days+' يوم · '+Number(x.price_iqd).toLocaleString('ar-IQ')+' د.ع</option>').join('');if(restaurants.length)load()}
async function load(){const id=$('restaurant').value;const [p,s]=await Promise.all([db.from('restaurant_payment_methods').select('*').eq('restaurant_id',id).order('sort_order'),db.from('restaurant_subscriptions').select('*').eq('restaurant_id',id).order('created_at',{ascending:false})]);if(p.error||s.error){$('status').textContent=(p.error||s.error).message;return}payments=p.data||[];subs=s.data||[];renderPayments();renderSubs()}
function renderPayments(){$('paymentsBox').innerHTML=payments.length?'<table><thead><tr><th>الوسيلة</th><th>النوع</th><th>الحالة</th><th>إثبات الدفع</th><th></th></tr></thead><tbody>'+payments.map(x=>'<tr><td>'+esc(x.method_name)+'</td><td>'+esc(x.method_type)+'</td><td>'+(x.is_enabled?'مفعّلة':'متوقفة')+'</td><td>'+(x.require_proof?'مطلوب':'غير مطلوب')+'</td><td><button class="ghost" data-edit-payment="'+x.id+'">تعديل</button> <button class="ghost" data-toggle-payment="'+x.id+'">'+(x.is_enabled?'تعطيل':'تفعيل')+'</button></td></tr>').join('')+'</tbody></table>':'لا توجد وسائل دفع.'}
function renderSubs(){$('subsBox').innerHTML=subs.length?'<table><thead><tr><th>الحالة</th><th>السعر</th><th>تبدأ</th><th>تنتهي</th><th></th></tr></thead><tbody>'+subs.map(x=>'<tr><td>'+esc(x.status)+'</td><td>'+Number(x.price_iqd).toLocaleString('ar-IQ')+' د.ع</td><td>'+esc(x.starts_at||'—')+'</td><td>'+esc(x.ends_at||'—')+'</td><td><button class="ghost" data-edit-sub="'+x.id+'">تعديل</button></td></tr>').join('')+'</tbody></table>':'لا يوجد سجل اشتراك.'}
$('restaurant').onchange=load;
function updateSubscriptionEnd(){const start=$('starts').value;const plan=plans.find(x=>x.id===$('plan').value);if(!start||!plan)return;const d=new Date(start);d.setDate(d.getDate()+Number(plan.duration_days||0));$('ends').value=d.toISOString().slice(0,16)}
$('plan').onchange=updateSubscriptionEnd;$('starts').onchange=updateSubscriptionEnd;
$('paymentForm').onsubmit=async e=>{e.preventDefault();const id=$('paymentId').value;const payload={method_name:$('methodName').value.trim(),method_type:$('methodType').value,account_name:$('accountName').value.trim()||null,account_details:$('accountDetails').value.trim()||null,qr_image_url:$('qrUrl').value.trim()||null,instructions:$('instructions').value.trim()||null,is_enabled:$('enabled').checked,require_proof:$('proof').checked};const q=id?db.from('restaurant_payment_methods').update(payload).eq('id',id):db.from('restaurant_payment_methods').insert({...payload,restaurant_id:$('restaurant').value});const {error}=await q;$('status').textContent=error?.message||'تم حفظ وسيلة الدفع.';if(!error){$('paymentForm').reset();$('paymentId').value='';$('enabled').checked=true;await load()}};
$('clearPayment').onclick=()=>{$('paymentForm').reset();$('paymentId').value='';$('enabled').checked=true};
$('subForm').onsubmit=async e=>{e.preventDefault();const id=$('subId').value;const plan=plans.find(x=>x.id===$('plan').value);const payload={plan_id:$('plan').value,status:$('subStatus').value,starts_at:$('starts').value?new Date($('starts').value).toISOString():null,ends_at:$('ends').value?new Date($('ends').value).toISOString():null,price_iqd:Number($('subPrice').value||plan?.price_iqd||0),notes:$('subNotes').value.trim()||null};const q=id?db.from('restaurant_subscriptions').update(payload).eq('id',id):db.from('restaurant_subscriptions').insert({...payload,restaurant_id:$('restaurant').value});const {error}=await q;$('status').textContent=error?.message||'تم حفظ الاشتراك.';if(!error){$('subForm').reset();$('subId').value='';await load()}};
$('clearSub').onclick=()=>{$('subForm').reset();$('subId').value=''};
document.addEventListener('click',async e=>{const edit=e.target.closest('[data-edit-payment]');if(edit){const x=payments.find(p=>p.id===edit.dataset.editPayment);$('paymentId').value=x.id;$('methodName').value=x.method_name;$('methodType').value=x.method_type;$('accountName').value=x.account_name||'';$('accountDetails').value=x.account_details||'';$('qrUrl').value=x.qr_image_url||'';$('instructions').value=x.instructions||'';$('enabled').checked=x.is_enabled;$('proof').checked=x.require_proof}
const toggle=e.target.closest('[data-toggle-payment]');if(toggle){const x=payments.find(p=>p.id===toggle.dataset.togglePayment);const {error}=await db.from('restaurant_payment_methods').update({is_enabled:!x.is_enabled}).eq('id',x.id);$('status').textContent=error?.message||'تم تحديث حالة الوسيلة.';if(!error)load()}
const sub=e.target.closest('[data-edit-sub]');if(sub){const x=subs.find(s=>s.id===sub.dataset.editSub);$('subId').value=x.id;$('plan').value=x.plan_id;$('subStatus').value=x.status;$('starts').value=x.starts_at?new Date(x.starts_at).toISOString().slice(0,16):'';$('ends').value=x.ends_at?new Date(x.ends_at).toISOString().slice(0,16):'';$('subPrice').value=x.price_iqd;$('subNotes').value=x.notes||'';document.querySelector('[data-tab="subscriptions"]').click()}
});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['payments','subscriptions'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab))});
db.auth.getSession().then(({data})=>{if(data.session)boot()});
</script></body></html>
