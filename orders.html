<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c90019"><title>Food Fort | الطلبات</title><style>body{margin:0;background:#f4f4f4;font-family:Tahoma,Arial;color:#222}header{background:#c90019;color:white;padding:22px;text-align:center}main{max-width:900px;margin:auto;padding:16px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bar a,.bar button{border:0;border-radius:9px;padding:10px 14px;background:#222;color:white;text-decoration:none}.order{background:white;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 2px 8px #0001}.order h3{margin:0 0 8px;color:#c90019}.muted{color:#777;font-size:13px}.items{padding:8px 0;border-top:1px solid #eee;border-bottom:1px solid #eee}.total{font-weight:bold;font-size:18px}.status{padding:7px 10px;border-radius:8px;background:#fff0d4;display:inline-block;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:0;border-radius:8px;padding:9px 12px;background:#16834b;color:white}.actions .del{background:#a22}</style></head><body><header><h1>Food Fort</h1><div>لوحة طلبات الكاشير</div></header><main><div class="bar"><h2>الطلبات الواردة</h2><div><a href="index.html">العودة للمنيو</a> <button onclick="render()">تحديث</button></div></div><p class="muted">نسخة تجريبية: تعرض الطلبات المحفوظة على نفس المتصفح والجهاز فقط. ربط الأجهزة يحتاج قاعدة بيانات مشتركة.</p><div id="orders"></div></main><script>function render(){let data=JSON.parse(localStorage.getItem("foodfort-orders")||"[]");let root=document.getElementById("orders");if(!data.length){root.innerHTML="<div class='order'>لا توجد طلبات بعد.</div>";return}root.innerHTML=data.map((o,i)=>"<article class='order'><h3>طلب "+o.id+"</h3><div class='muted'>"+o.time+"</div><p><b>الزبون:</b> "+o.name+" | <b>الهاتف:</b> "+o.phone+"</p><p><b>النوع:</b> "+o.service+(o.service==="صالة"?" | <b>الطاولة:</b> "+o.table:"")+"</p><div class='items'>"+o.items.map(x=>x.name+" × "+x.qty+" = "+Number(x.price*x.qty).toLocaleString("en-US")+" د.ع").join("<br>")+"</div><p class='total'>المجموع: "+Number(o.total).toLocaleString("en-US")+" د.ع</p><span class='status'>"+o.status+"</span><div class='actions'><button onclick='setStatus("+i+","قيد التحضير")'>قيد التحضير</button><button onclick='setStatus("+i+","جاهز")'>جاهز</button><button class='del' onclick='removeOrder("+i+")'>حذف</button></div></article>").join("")}function setStatus(i,s){let d=JSON.parse(localStorage.getItem("foodfort-orders")||"[]");d[i].status=s;localStorage.setItem("foodfort-orders",JSON.stringify(d));render()}function removeOrder(i){let d=JSON.parse(localStorage.getItem("foodfort-orders")||"[]");d.splice(i,1);localStorage.setItem("foodfort-orders",JSON.stringify(d));render()}render();</script></body></html>
