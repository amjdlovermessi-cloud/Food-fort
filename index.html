<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c90019"><title>Food Fort | المنيو الإلكتروني</title>
<style>
:root{--red:#c90019}*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#222;font-family:Tahoma,Arial,sans-serif}header{background:linear-gradient(135deg,#b90017,#ed1029);color:#fff;text-align:center;padding:24px 16px 18px;border-radius:0 0 24px 24px}.logo{font-size:34px;font-weight:900}header p{margin:7px 0}.toplinks{display:flex;justify-content:center;gap:10px;margin-top:14px}.toplinks a{color:#fff;text-decoration:none;border:1px solid #ffffff80;border-radius:20px;padding:7px 13px;font-size:13px}.wrap{max-width:980px;margin:auto;padding:16px}.notice,.cartbox{background:#fff;border-radius:15px;padding:14px;margin:14px 0}.notice{font-size:13px;color:#666}.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 14px;position:sticky;top:0;background:#f5f5f5;z-index:2}.tabs button{white-space:nowrap;border:0;border-radius:22px;padding:10px 16px;background:#fff;font-weight:bold}.tabs button.active,.add{background:var(--red);color:#fff}.section-title{font-size:21px;color:var(--red);margin:20px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.item{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px #0000000a;display:flex;flex-direction:column;gap:8px}.item h3{margin:0;font-size:16px}.item p{margin:0;color:#777;font-size:12px}.price{font-weight:900;color:var(--red);font-size:18px}.add{border:0;border-radius:10px;padding:10px;font-weight:bold;cursor:pointer}.cartline{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:10px 0}.qty button{border:0;background:#eee;border-radius:7px;padding:5px 10px;font-size:17px}.field{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit;margin:6px 0 12px}.choice{display:flex;gap:10px;flex-wrap:wrap}.choice label{background:#f5f5f5;padding:10px 14px;border-radius:10px}.submit{width:100%;padding:14px;border:0;border-radius:12px;background:#178447;color:#fff;font-size:16px;font-weight:bold}footer{text-align:center;padding:25px;color:#888;font-size:12px}@media(max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.item{padding:11px}.item h3{font-size:14px}.price{font-size:16px}}
</style></head><body>
<header><div class="logo">🍴 Food Fort</div><p>اختار وجبتك وخلي الباقي علينا</p><div class="toplinks"><a href="#menu">المنيو</a><a href="orders.html">صفحة الكاشير</a></div></header>
<main class="wrap"><div class="notice">الأسعار بالدينار العراقي. أضف وجباتك للسلة وحدد صالة أو سفري قبل إرسال الطلب.</div><nav class="tabs" id="tabs"></nav><div id="menu"></div>
<section class="cartbox" id="cart"><h2 class="section-title">🛒 سلة الطلبات</h2><div id="cartitems">السلة فارغة حالياً</div><h3>المجموع: <span id="total">0</span> د.ع</h3><h3>طريقة الاستلام</h3><div class="choice"><label><input type="radio" name="service" value="صالة" checked onchange="toggleTable()"> صالة</label><label><input type="radio" name="service" value="سفري" onchange="toggleTable()"> سفري</label></div><div id="tablewrap"><label>رقم الطاولة</label><select class="field" id="table"><option value="">اختر رقم الطاولة</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option></select></div><label>اسم الزبون</label><input class="field" id="customer" placeholder="الاسم"><label>رقم الهاتف</label><input class="field" id="phone" inputmode="tel" placeholder="07xxxxxxxxx"><button class="submit" onclick="placeOrder()">إرسال الطلب للكاشير</button><p id="msg" aria-live="polite"></p></section></main><footer>Food Fort © المنيو الإلكتروني</footer>
<script>
const groups=[
{name:"البرغر",items:[["چيز برگر",6500],["دبل برگر",6500],["برغر دجاج",5500],["برغر كلاسيك",4000],["برغر",8000],["سوبر برغر",6500],["كرانشي",7000],["هايدو",6500],["كلاسيك",6000],["مشروب",6500],["برغر",7500]]},
{name:"الشاورما والصاج",items:[["طبق شاورما لحم",16000],["طبق شاورما دجاج",14000],["طبق شاورما مكس",15000],["نصف طبق شاورما لحم",9000],["نصف طبق شاورما دجاج",8000],["صاج شاورما لحم",5500],["صاج شاورما دجاج",4500],["صاج عربي دجاج",3500],["صاج عربي لحم",5000],["صاج ستربس",5000],["صاج ستربس سبايسي",5000],["صاج لحم إيطالي",8000],["صاج دجاج إيطالي",7000]]},
{name:"السندويشات",items:[["سندويش شاورما لحم",4500],["سندويش شاورما دجاج",4000],["سندويش فلافل",5000],["لازانيا بالساج دجاج",8000],["لازانيا بالساج",6000],["جيلي هات داك",4000],["هات داك",3500]]},
{name:"المقرمشات والمقبلات",items:[["فطر مقرمش",4500],["حلقات البصل",4000],["أجنحة مقرمشة",3500],["أجنحة باربكيو",4000],["أجنحة هني ماستر",4000],["خبز بالثوم",4000],["ميني بيروني",4500],["فنكر",2000],["فنكر مقرمش",2500],["فنكر بالجبن",3000],["ماعون مقبلات صغير",2500],["ماعون مقبلات وسط",5000],["ماعون مقبلات كبير",8000],["سلطة سيزر",7000],["وجبة دايت 200 غرام",5000]]},
{name:"البيتزا",items:[["بيتزا شاورما دجاج",["7000","10250","13250","17000"]],["بيتزا شاورما مشكل",["7000","11000","14250","18000"]],["بيتزا شاورما لحم",["7000","12000","15250","19250"]],["بيتزا دوني",["7000","11000","14250","17000"]],["بيتزا فاهيتا",["7000","10250","12000","15250"]],["بيتزا ستيك لحم",["7000","12000","15250","17000"]],["بيتزا تكس مكس",["7000","10250","12000","15250"]],["بيتزا بيبروني",["7000","12000","15250","17000"]],["بيتزا مناقيش",["6500","8000","10250","12000"]],["بيتزا خضار",["6500","9000","11000","13250"]],["بيتزا مارغريتا",["6500","8000","10250","12000"]]]}
];
let cart=[];const money=n=>Number(n).toLocaleString("en-US");
function render(){document.getElementById("tabs").innerHTML=groups.map((g,i)=>'<button class="'+(i===0?'active':'')+'" onclick="showGroup('+i+')">'+g.name+'</button>').join("");document.getElementById("menu").innerHTML=groups.map((g,i)=>'<section id="g'+i+'"><h2 class="section-title">'+g.name+'</h2><div class="grid">'+g.items.map(it=>{if(Array.isArray(it[1]))return '<article class="item"><h3>'+it[0]+'</h3><p>اختار الحجم: صغير، وسط، كبير، عائلي</p>'+it[1].map((p,k)=>'<div style="display:flex;justify-content:space-between;align-items:center;gap:4px"><span>'+["صغير","وسط","كبير","عائلي"][k]+': <b class="price">'+money(p)+'</b></span><button class="add" onclick="add(\''+it[0]+' - '+["صغير","وسط","كبير","عائلي"][k]+'\','+p+')">+</button></div>').join("")+'</article>';return '<article class="item"><h3>'+it[0]+'</h3><p>من قائمة Food Fort</p><div class="price">'+money(it[1])+' د.ع</div><button class="add" onclick="add(\''+it[0]+'\','+it[1]+')">أضف للسلة</button></article>'}).join("")+'</div></section>').join("")}
function showGroup(i){document.getElementById("g"+i).scrollIntoView({behavior:"smooth"});document.querySelectorAll(".tabs button").forEach((b,k)=>b.classList.toggle("active",i===k))}
function add(name,price){let x=cart.find(x=>x.name===name);if(x)x.qty++;else cart.push({name:name,price:Number(price),qty:1});drawCart()}
function drawCart(){document.getElementById("cartitems").innerHTML=cart.length?cart.map((x,i)=>'<div class="cartline"><div><b>'+x.name+'</b><br><small>'+money(x.price*x.qty)+' د.ع</small></div><div class="qty"><button onclick="change('+i+',-1)">−</button> '+x.qty+' <button onclick="change('+i+',1)">+</button></div></div>').join(""):"السلة فارغة حالياً";document.getElementById("total").textContent=money(cart.reduce((s,x)=>s+x.price*x.qty,0))}
function change(i,n){cart[i].qty+=n;if(cart[i].qty<=0)cart.splice(i,1);drawCart()}
function toggleTable(){document.getElementById("tablewrap").style.display=document.querySelector('[name=service]:checked').value==="صالة"?"block":"none"}
function placeOrder(){if(!cart.length)return alert("أضف وجبة واحدة على الأقل");let service=document.querySelector('[name=service]:checked').value,table=document.getElementById("table").value;if(service==="صالة"&&!table)return alert("حدد رقم الطاولة");let name=document.getElementById("customer").value.trim(),phone=document.getElementById("phone").value.trim();if(!name||!phone)return alert("اكتب اسمك ورقم هاتفك");let order={id:"FF-"+Date.now().toString().slice(-6),name:name,phone:phone,service:service,table:service==="صالة"?table:"-",items:cart,total:cart.reduce((s,x)=>s+x.price*x.qty,0),time:new Date().toLocaleString("ar-IQ"),status:"جديد"};let orders=JSON.parse(localStorage.getItem("foodfort-orders")||"[]");orders.unshift(order);localStorage.setItem("foodfort-orders",JSON.stringify(orders));cart=[];drawCart();document.getElementById("msg").textContent="تم تسجيل الطلب تجريبياً. رقم الطلب: "+order.id+" (على هذا الجهاز فقط حالياً)";document.getElementById("customer").value="";document.getElementById("phone").value=""}
render();drawCart();toggleTable();
</script></body></html>
